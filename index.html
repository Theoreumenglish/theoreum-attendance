<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>더오름 출결</title>

	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" sizes="192x192" href="/icon-192.png">
	<link rel="icon" sizes="512x512" href="/icon-512.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/icon-apple-180.png">
	<meta name="theme-color" content="#4f46e5">

	<!-- 외부 웹폰트 제거: 키오스크 속도/안정성 우선 -->
	<style>
		:root {
			--bg: #f1f5f9;
			--card: #ffffff;
			--text: #0f172a;
			--sub: #64748b;
			--line: #e2e8f0;
			--pri: #4f46e5;
			--sky: #0ea5e9;
			--ok: #10b981;
			--warn: #f59e0b;
			--bad: #ef4444;
			--shadow-huge: 0 20px 40px rgba(15, 23, 42, 0.08);
			--shadow-soft: 0 8px 16px rgba(15, 23, 42, 0.05);
			--overlay-bg: rgba(255, 255, 255, 0.85);
			--r-xl: 32px;
			--r-lg: 24px;
			--r-md: 16px;
		}

		body.dark-mode {
			--bg: #0f172a;
			--card: #1e293b;
			--text: #f8fafc;
			--sub: #94a3b8;
			--line: #334155;
			--shadow-huge: 0 20px 40px rgba(0, 0, 0, 0.4);
			--overlay-bg: rgba(15, 23, 42, 0.85);
		}

		* {
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		html, body {
			height: 100%;
			overflow: hidden;
		}

		body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

		body.flash-ok { background-color: #dcfce7 !important; }
		body.flash-no { background-color: #fee2e2 !important; }

		.hidden { display: none !important; }

		#offlineLock {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.86);
			color: #fff;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			z-index: 10002;
			opacity: 0;
			pointer-events: none;
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			transition: opacity 0.3s ease;
		}

		#offlineLock.show {
			opacity: 1;
			pointer-events: all;
		}

		#screensaver {
			position: fixed;
			inset: 0;
			background: #ffffff;
			color: #0f172a;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 10000;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.4s ease;
		}

		#screensaver.active {
			opacity: 1;
			pointer-events: all;
		}

		.clock-time {
			font-size: 150px;
			font-weight: 900;
			letter-spacing: -3px;
			margin: 0;
		}

		.clock-date {
			font-size: 34px;
			font-weight: 600;
			color: #64748b;
			margin-bottom: 80px;
		}

		.hint-pulse {
			font-size: 30px;
			font-weight: 800;
			color: #2563eb;
			animation: pulse 2s infinite;
		}

		#fullModal {
			position: fixed;
			inset: 0;
			background: var(--overlay-bg);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 10001;
			opacity: 0;
			pointer-events: none;
			transform: scale(1.04);
			transition: all 0.25s ease;
			text-align: center;
		}

		#fullModal.show {
			opacity: 1;
			pointer-events: all;
			transform: scale(1);
		}

		.modal-icon {
			width: 160px;
			height: 160px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 32px;
		}

		.modal-icon.ok {
			background: var(--ok);
			color: #fff;
			box-shadow: 0 0 0 24px rgba(16, 185, 129, 0.18);
		}

		.modal-icon.no {
			background: var(--bad);
			color: #fff;
			box-shadow: 0 0 0 24px rgba(239, 68, 68, 0.18);
		}

		.modal-title {
			font-size: 62px;
			font-weight: 900;
			margin: 0 0 14px;
			letter-spacing: -1px;
		}

		.modal-desc {
			font-size: 30px;
			font-weight: 700;
			color: var(--sub);
			max-width: 80%;
			line-height: 1.45;
			margin: 0;
		}

		.busy {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: 6px;
			background: linear-gradient(90deg, var(--pri), var(--sky));
			transform: scaleX(0);
			transform-origin: left;
			transition: transform .2s ease;
			z-index: 999;
		}

		.busy.on {
			transform: scaleX(1);
		}

		.topbar {
			position: sticky;
			top: 0;
			z-index: 50;
			background: var(--card);
			border-bottom: 2px solid var(--line);
			box-shadow: var(--shadow-soft);
			transition: opacity 0.25s ease;
			opacity: 0.16;
		}

		.topbar:hover {
			opacity: 1;
		}

		.wrap {
			max-width: 1280px;
			margin: 0 auto;
			padding: 16px 24px;
		}

		.row {
			display: flex;
			align-items: center;
			gap: 16px;
			flex-wrap: wrap;
		}

		.sp { margin-left: auto; }

		.brand {
			display: flex;
			align-items: center;
			cursor: pointer;
		}

		.header-logo {
			height: 32px;
			width: auto;
			object-fit: contain;
		}

		.pill {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 10px 18px;
			border: 2px solid var(--line);
			border-radius: 999px;
			background: var(--bg);
			font-size: 15px;
			font-weight: 800;
			color: var(--text);
		}

		.dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: var(--ok);
			box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
		}

		.navRow {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-left: 28px;
		}

		.tabBtn {
			border: none;
			background: transparent;
			padding: 12px 24px;
			border-radius: 16px;
			cursor: pointer;
			font-weight: 900;
			font-size: 18px;
			color: var(--sub);
			transition: all 0.2s ease;
		}

		.tabBtn:hover {
			background: var(--bg);
			color: var(--text);
		}

		.tabBtn.on {
			background: rgba(79, 70, 229, 0.1);
			color: var(--pri);
		}

		.main {
			height: calc(100vh - 84px);
			padding: 40px 20px;
			overflow-y: auto;
		}

		.viewport {
			max-width: 1280px;
			margin: 0 auto;
			min-height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.card {
			width: 100%;
			background: var(--card);
			border-radius: var(--r-xl);
			box-shadow: var(--shadow-huge);
			padding: 48px;
			transition: background 0.25s ease;
		}

		.heroCard { max-width: 960px; }

		/* kiosk-visual-qa-v1: compact enough for common kiosk/tablet heights */
		@media (min-width: 769px) {
			.main {
				padding: 24px 20px;
			}

			.heroCard {
				padding: 36px 48px;
			}

			.titleWrap {
				margin-bottom: 28px;
			}

			.actGrid {
				gap: 18px;
				margin-bottom: 22px;
			}

			.actBtn {
				min-height: 142px;
				padding: 28px 16px;
			}
		}

		@media (max-height: 850px) and (min-width: 769px) {
			.main {
				padding: 14px 20px;
			}

			.heroCard {
				max-width: 940px;
				padding: 30px 44px;
			}

			.titleWrap {
				margin-bottom: 22px;
			}

			.floor-badge {
				margin-bottom: 12px;
			}

			.cardTitle {
				font-size: 42px;
			}

			.actGrid {
				gap: 16px;
				margin-bottom: 20px;
			}

			.actBtn {
				min-height: 132px;
				padding: 20px 14px;
			}

			.actBtn svg {
				width: 46px;
				height: 46px;
			}
		}

		.titleWrap {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin-bottom: 40px;
		}

		.floor-badge {
			background: rgba(79, 70, 229, 0.1);
			color: var(--pri);
			padding: 8px 24px;
			border-radius: 999px;
			font-size: 18px;
			font-weight: 900;
			margin-bottom: 16px;
		}

      .kStaffQuick {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 18px;
        width: min(560px, calc(100vw - 28px));
        max-height: min(42vh, 260px);
        overflow: auto;
        transform: translateX(-50%);
        padding: 18px;
        border: 2px solid rgba(79, 70, 229, 0.22);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 46px rgba(15, 23, 42, 0.18);
        z-index: 9999;
      }

      .kStaffQuick.show {
        display: block;
      }

      .kStaffQuickHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .kStaffQuickTitle {
        font-size: 16px;
        font-weight: 900;
        color: var(--pri);
        letter-spacing: -0.2px;
      }

      .kStaffQuickClose {
        border: none;
        background: transparent;
        color: var(--sub);
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: 10px;
      }

      .kStaffQuickClose:hover {
        background: rgba(15, 23, 42, 0.06);
        color: var(--text);
      }

      .kStaffQuickRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 10px;
      }

      .kStaffQuickBtn {
        border: 2px solid var(--line);
        background: #fff;
        color: var(--sub);
        border-radius: 16px;
        padding: 14px 12px;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        transition: all .15s ease;
      }

      .kStaffQuickBtn.on {
        border-color: var(--pri);
        background: rgba(79, 70, 229, 0.10);
        color: var(--pri);
        box-shadow: 0 8px 16px rgba(79, 70, 229, 0.12);
      }

      .kStaffQuickHint {
        font-size: 13px;
        font-weight: 700;
        color: var(--sub);
        text-align: center;
        line-height: 1.45;
      }

      .adminWorkHeader {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding: 2px 0 4px;
      }

      .adminWorkKicker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(79, 70, 229, 0.10);
        color: var(--pri);
        font-size: 13px;
        font-weight: 900;
      }

      .adminWorkTitle {
        font-size: 28px;
        font-weight: 950;
        letter-spacing: -0.8px;
        color: var(--text);
      }

      .adminWorkDesc {
        margin-top: 8px;
        color: var(--sub);
        font-size: 15px;
        font-weight: 750;
        line-height: 1.55;
      }

      .adminWorkBadge {
        flex: 0 0 auto;
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(16, 185, 129, 0.10);
        color: #047857;
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .adminQuickGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .adminQuickGroup {
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 22px;
        padding: 16px;
        background: rgba(248, 250, 252, 0.86);
      }

      .adminQuickGroupTitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 15px;
        font-weight: 950;
        color: var(--text);
      }

      .adminQuickGroupHint {
        color: var(--sub);
        font-size: 12px;
        font-weight: 800;
      }

      .adminQuickStack {
        display: grid;
        gap: 10px;
      }

      .adminQuickBtn {
        width: 100%;
        border: 1px solid rgba(79, 70, 229, 0.18);
        background: #fff;
        color: var(--text);
        border-radius: 18px;
        padding: 15px 14px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      }

      .adminQuickBtn:hover {
        transform: translateY(-1px);
        border-color: rgba(79, 70, 229, 0.42);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.10);
      }

      .adminQuickBtn.primary {
        border-color: rgba(79, 70, 229, 0.32);
        background: linear-gradient(180deg, rgba(79, 70, 229, 0.10), #fff);
      }

      .adminQuickBtn.warn {
        border-color: rgba(245, 158, 11, 0.36);
        background: linear-gradient(180deg, rgba(245, 158, 11, 0.11), #fff);
      }

      .adminQuickBtn.danger {
        border-color: rgba(239, 68, 68, 0.28);
        background: linear-gradient(180deg, rgba(239, 68, 68, 0.08), #fff);
      }

      .adminQuickTitle {
        font-size: 16px;
        font-weight: 950;
        color: var(--pri);
      }

      .adminQuickBtn.warn .adminQuickTitle {
        color: #b45309;
      }

      .adminQuickBtn.danger .adminQuickTitle {
        color: #b91c1c;
      }

      .adminQuickDesc {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 750;
        color: var(--sub);
        line-height: 1.45;
      }

      .adminQrNotice {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(14, 165, 233, 0.08);
        border: 1px solid rgba(14, 165, 233, 0.20);
        color: #075985;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.55;
      }

      @media (max-width: 980px) {
        .adminWorkHeader {
          display: block;
        }

        .adminWorkBadge {
          display: inline-flex;
          margin-top: 12px;
        }

        .adminQuickGrid {
          grid-template-columns: 1fr;
        }
      }

		.cardTitle {
			font-size: 46px;
			font-weight: 900;
			letter-spacing: -1px;
			margin: 0;
			color: var(--text);
		}

		.actGrid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 24px;
			margin-bottom: 32px;
		}

		.actBtn {
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			border: 3px solid var(--line);
			background: var(--bg);
			border-radius: var(--r-lg);
			padding: 36px 16px;
			cursor: pointer;
			font-size: 26px;
			font-weight: 900;
			color: var(--sub);
			opacity: 0.45;
			filter: grayscale(50%);
			transition: all 0.25s ease;
		}

		.actBtn:hover {
			opacity: 0.82;
			filter: grayscale(0%);
			border-color: var(--pri);
		}

		.actBtn.on {
			background: linear-gradient(135deg, #2563eb, #0ea5e9);
			border-color: transparent;
			color: #fff;
			box-shadow: 0 16px 32px rgba(37, 99, 235, 0.26);
			transform: translateY(-3px);
			opacity: 1;
			filter: grayscale(0%);
		}

		.actBtn svg {
			width: 56px;
			height: 56px;
			pointer-events: none;
		}

		.spinner {
			display: none;
			width: 40px;
			height: 40px;
			border: 4px solid rgba(255, 255, 255, 0.25);
			border-top-color: #fff;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			position: absolute;
		}

		.actBtn.loading svg,
		.actBtn.loading span {
			opacity: 0;
		}

		.actBtn.loading .spinner {
			display: block;
		}

		.input-wrapper {
			position: relative;
			width: 100%;
		}

		.inp-big {
			width: 100%;
			height: 130px;
			padding: 24px 32px;
			text-align: center;
			font-size: 52px;
			font-weight: 900;
			letter-spacing: 12px;
			border: 3px solid var(--line);
			border-radius: var(--r-lg);
			background: var(--bg);
			color: var(--text);
			box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.04);
			outline: none;
			transition: all 0.2s ease;
			caret-color: transparent;
		}

		.inp-big::placeholder {
			font-size: 28px;
			letter-spacing: normal;
			color: var(--sub);
			font-weight: 800;
		}

		.inp-big:focus {
			background: var(--card);
			border-color: var(--pri);
			box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.15);
		}

		.inp-big:disabled {
			background: #e2e8f0;
			color: #94a3b8;
			border-color: #cbd5e1;
			cursor: not-allowed;
			letter-spacing: 2px;
		}



		.phoneSegmentRow {
			width: min(720px, 100%);
			min-height: 104px;
			display: grid;
			grid-template-columns: auto 1fr auto 1fr;
			align-items: center;
			justify-content: center;
			gap: 10px;
			margin: 0 auto;
			padding: 12px 18px;
			border: 3px solid var(--line);
			border-radius: 24px;
			background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
			box-shadow: 0 18px 45px rgba(15, 23, 42, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.75);
			transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
		}

		.phoneSegmentRow:focus-within {
			border-color: var(--pri);
			box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.13), 0 20px 48px rgba(15, 23, 42, 0.12);
			transform: translateY(-1px);
		}

		.phoneStatic {
			font-size: clamp(34px, 5.2vw, 52px);
			font-weight: 1000;
			letter-spacing: 0;
			color: var(--text);
			line-height: 1;
			white-space: nowrap;
		}

		.phoneSegmentInput {
			width: 100%;
			min-width: 0;
			height: 72px;
			border: 2px solid #dbe3ef;
			border-radius: 22px;
			outline: none;
			background: #ffffff;
			color: var(--text);
			text-align: center;
			font-size: clamp(36px, 5.8vw, 56px);
			font-weight: 1000;
			letter-spacing: 0.18em;
			text-indent: 0.18em;
			caret-color: var(--pri);
			box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.05);
		}

		.phoneSegmentInput:focus {
			border-color: var(--pri);
			box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12), inset 0 2px 6px rgba(15, 23, 42, 0.04);
		}

		.phoneSegmentInput:disabled {
			opacity: 0.45;
			cursor: not-allowed;
		}

		@media (max-height: 850px) and (min-width: 769px) {
			.phoneSegmentRow {
				min-height: 92px;
				padding: 10px 16px;
			}

			.phoneSegmentInput {
				height: 64px;
			}
		}

		@media (max-width: 640px) {
			.phoneSegmentRow {
				grid-template-columns: auto minmax(110px, 1fr) auto minmax(110px, 1fr);
				gap: 6px;
				padding: 14px;
			}

			.phoneSegmentInput {
				height: 72px;
			}
		}

		.phoneRawInput {
			position: absolute !important;
			width: 1px !important;
			height: 1px !important;
			padding: 0 !important;
			border: 0 !important;
			opacity: 0 !important;
			pointer-events: none !important;
			left: -9999px !important;
		}


		.inp {
			width: 100%;
			border: 2px solid var(--line);
			background: var(--bg);
			color: var(--text);
			border-radius: 16px;
			padding: 16px 20px;
			font-size: 18px;
			font-weight: 800;
			outline: none;
			transition: all 0.2s ease;
		}

		.inp:focus {
			background: var(--card);
			border-color: var(--pri);

	<script>
		// 📌 [수정] PWA 서비스워커 활성화
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/sw.js').catch(() => {});
		}

		const $ = (sel, root = document) => root.querySelector(sel);

		function escapeHtml(s) {
			return String(s == null ? '' : s)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

      function safeFocus(el, delay = 0) {
        const run = () => {
          if (!el) return;
          if (!document.contains(el)) return;
          if (typeof el.focus !== 'function') return;

          try {
            el.focus({ preventScroll: true });
          } catch (_) {
            try {
              el.focus();
            } catch (__) {}
          }
        };

        if (delay > 0) setTimeout(run, delay);
        else run();
      }
    function renderFatalBootError(title, message) {
		const v = document.getElementById('viewPort');
		if (!v) return;

		const bootSkeleton = document.getElementById('bootSkeleton');
		const stillBooting = !!bootSkeleton && document.contains(bootSkeleton);

		if (!stillBooting) {
			console.error('[NON_FATAL_UI_ERROR]', title, message);
			return;
		}

		v.innerHTML = `
			<div style="max-width:900px;width:100%;margin:40px auto;background:#fff1f2;border:2px solid #fecdd3;
						color:#881337;border-radius:24px;padding:28px;font-weight:800;line-height:1.6;">
			<div style="font-size:28px;margin-bottom:12px;">${escapeHtml(title)}</div>
			<div style="font-size:16px;white-space:pre-wrap;">${escapeHtml(String(message || '알 수 없는 오류'))}</div>
			</div>
		`;
	}

	window.addEventListener('error', (e) => {
		renderFatalBootError('화면 초기화 오류', e && e.message ? e.message : '알 수 없는 오류');
	});

	window.addEventListener('unhandledrejection', (e) => {
		const msg = e && e.reason ? (e.reason.message || String(e.reason)) : 'Promise 오류';
		renderFatalBootError('비동기 초기화 오류', msg);
	});

    window.__logoFail = function(img) {
      try {
        App.rpc('meta.logoError', {
          src: img && img.src ? img.src : '',
          userAgent: navigator.userAgent || '',
          currentView: App.currentView || ''
        });
      } catch (_) {}

      if (img) {
        img.onerror = null;
        img.src = '/student-qr-brand.svg';
      }
    };

		let inactivityTimer = null;
    const resetInactivity = () => {
      clearTimeout(inactivityTimer);

      if (App.currentView !== 'kiosk') {
        inactivityTimer = setTimeout(() => {
          if (App.currentView !== 'kiosk') {
            Router.goKiosk().then(() => {
              UI.toast(false, '보안을 위해 키오스크 화면으로 자동 복귀했습니다.');
            });
          }
        }, 3 * 60 * 1000);
      }
    };

		['touchstart', 'mousemove', 'keydown'].forEach(evt => {
			document.body.addEventListener(evt, resetInactivity, { passive: true });
		});

		const App = {
			sess: localStorage.getItem('ATT_SESS') || '',
			pending: 0,
			currentView: localStorage.getItem('ATT_LAST_VIEW') || 'kiosk',
			meta: null,
			_booted: false,

			rpc(op, args = {}, extra = {}) {
				return new Promise(async (resolve) => {
					App.pending++;
					UI.busy(true);

					const controller = new AbortController();
					const timeoutMs =
						(op === 'kiosk.mark' || op === 'staff.clock.qr') ? 20000 : 15000;
					const timer = setTimeout(() => controller.abort(), timeoutMs);

					try {
						const payload = {
							op,
							args,
							sessionToken: App.sess,
							...extra
						};

						const res = await fetch('/api/rpc', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify(payload),
							cache: 'no-store',
							signal: controller.signal
						});

						const text = await res.text();
						let json = null;

						try {
							json = text ? JSON.parse(text) : null;
						} catch (e) {
							resolve({
								ok: false,
								error: {
									code: 'BAD_JSON',
									message: '서버 응답을 해석할 수 없습니다.'
								}
							});
							return;
						}

						const out = json || {
							ok: false,
							error: {
								code: 'EMPTY_RESPONSE',
								message: '빈 응답입니다.'
							}
						};

						const authCode = String((out && out.error && out.error.code) || '').trim().toUpperCase();
						const shouldResetStaffSession =
							App.currentView === 'staff' &&
							op !== 'auth.login' &&
							op !== 'auth.me' &&
							(
								authCode === 'AUTH_REQUIRED' ||
								authCode === 'SESSION_EXPIRED' ||
								authCode === 'INVALID_SESSION'
							);

						if (shouldResetStaffSession) {
							App.sess = '';
							localStorage.removeItem('ATT_SESS');
							App.setWho('guest');

							const logoutBtn = $('#btnLogout');
							if (logoutBtn) logoutBtn.classList.add('hidden');

							UI.render('tpl-login');
							Auth.initLogin();
							UI.toast(false, '세션이 만료되어 다시 로그인해주세요.');
						}

						resolve(out);
					} catch (err) {
						const aborted = err && err.name === 'AbortError';
						resolve({
							ok: false,
							error: {
								code: aborted ? 'RPC_TIMEOUT' : 'RPC_FAIL',
								message: aborted
									? '요청 시간이 초과되었습니다. 다시 시도해주세요.'
									: ((err && err.message) ? err.message : '서버 연결 실패')
							}
						});
					} finally {
						clearTimeout(timer);
						App.pending = Math.max(0, App.pending - 1);
						if (App.pending === 0) UI.busy(false);
					}
				});
			},

			kickNotifyWorker() {
				// 브라우저에서 직접 worker를 깨우지 않는다.
				// 서버 큐/크론이 후속 처리를 담당한다.
			},

			setWho(text) {
				const el = $('#whoPill');
				if (el) el.textContent = text || 'guest';
			},

			async refreshMeta() {
				const ping = await App.rpc('meta.ping');

				if (ping.ok) {
					App.meta = ping.data || {};
					UI.setMeta(App.meta);

				} else {
					App.meta = {
						safe: {
							mode: 'Y',
							message: (ping.error && ping.error.message) ? ping.error.message : '운영 메타 조회 실패'
						},
						kiosk_floor: (App.meta && App.meta.kiosk_floor) ? App.meta.kiosk_floor : '5F'
					};
					UI.setMeta(App.meta);
					UI.setKioskFloor(App.meta.kiosk_floor || '5F');
				}
			},

			async init() {
				if (App._booted) {

					return;
				}
				App._booted = true;

				Router.bindTopbar();

				const logoutBtn = $('#btnLogout');

				App.refreshMeta().catch(() => {});

			const Voice = {
				synth: window.speechSynthesis,
				voice: null,

				pickVoice() {
					if (!this.synth) return null;

					const voices = this.synth.getVoices ? this.synth.getVoices() : [];
					if (!voices || !voices.length) return null;

					const koVoices = voices.filter(v => /^ko[-_]?KR/i.test(v.lang || '') || /korean|한국|한국어/i.test(v.name || ''));

					const preferred = koVoices.find(v => /google|microsoft|sunhi|heami|natural|online/i.test(v.name || '')) ||
						koVoices[0] ||
						voices.find(v => /^ko/i.test(v.lang || '')) ||
						null;

					this.voice = preferred || null;
					return this.voice;
				},

				speak(text, mode = 'normal') {
					if (!this.synth || !text) return;

					this.synth.cancel();

					const u = new SpeechSynthesisUtterance(String(text || '').trim());
					u.lang = 'ko-KR';

					const selectedVoice = this.voice || this.pickVoice();
					if (selectedVoice) u.voice = selectedVoice;

					u.volume = 1.0;
					u.rate = mode === 'error' ? 0.96 : 1.01;
					u.pitch = mode === 'error' ? 1.0 : 1.12;

					this.synth.speak(u);
				}
			};

			if (Voice.synth && typeof Voice.synth.addEventListener === 'function') {
				Voice.synth.addEventListener('voiceschanged', () => Voice.pickVoice());
			}

		const UI = {
			audioCtx: null,

			showMsg(el, ok, text) {

				d.textContent = text || '';

					d.style.opacity = '0';

			},

			showModal(ok, title, desc) {

				$('#fmDesc').textContent = desc;

				ic.className = 'modal-icon ' + (ok ? 'ok' : 'no');

					: '<svg width="80" height="80" fill="none" stroke="currentColor" stroke-width="4" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

				m.classList.add('show');
				setTimeout(() => m.classList.remove('show'), 2000);
			},

			initAudio() {
				if (!UI.audioCtx) {
					UI.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				}
				if (UI.audioCtx.state === 'suspended') UI.audioCtx.resume();
			},

			beep(ok) {
				try {
					UI.initAudio();
					const o = UI.audioCtx.createOscillator();
					const g = UI.audioCtx.createGain();
					o.type = 'sine';
					o.frequency.value = ok ? 880 : 220;
					g.gain.value = 0.05;
					o.connect(g);
					g.connect(UI.audioCtx.destination);
					o.start();
					setTimeout(() => o.stop(), ok ? 90 : 160);
				} catch (e) {}
			},

			flashScreen(ok) {
				document.body.classList.add(ok ? 'flash-ok' : 'flash-no');
				setTimeout(() => {
					document.body.classList.remove(ok ? 'flash-ok' : 'flash-no');
				}, 800);
			},

			setMeta(meta) {
				const dot = $('#safeDot');
				const text = $('#safeText');
				const isSafe = !!(meta && meta.safe && String(meta.safe.mode || '').toUpperCase() === 'Y');

				if (dot) {
					dot.style.background = isSafe ? 'var(--bad)' : 'var(--ok)';
					dot.style.boxShadow = isSafe
						? '0 0 0 4px rgba(239, 68, 68, 0.15)'
						: '0 0 0 4px rgba(16, 185, 129, 0.15)';
				}
				if (text) text.textContent = isSafe ? 'Maintenance' : 'Online';
			},

			setKioskFloor(floor) {
				const floorPill = $('#floorPill');
				if (!floorPill) return;

				const normalized = String(floor || '5F').trim() || '5F';
				floorPill.textContent = normalized;

				if (normalized.includes('7')) {
					floorPill.style.background = '#fff7ed';
					floorPill.style.color = '#d97706';
				} else {
					floorPill.style.background = 'rgba(79, 70, 229, 0.1)';
					floorPill.style.color = 'var(--pri)';
				}
			},

			maskName(name) {
				if (!name) return '';
				if (name.length <= 2) return name.charAt(0) + '*';
				return name.charAt(0) + '*'.repeat(name.length - 2) + name.charAt(name.length - 1);
			},

      async withBtnBusy(selector, busyText, fn) {
        const btn = $(selector);
        if (!btn) return await fn();
        if (btn.disabled) return;

        const oldText = btn.textContent;
        btn.disabled = true;
        btn.textContent = busyText || '처리 중...';

        try {
          return await fn();
        } finally {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      },

			padSid(v) {
				const d = String(v || '').replace(/[^0-9]/g, '');
				if (!d) return '';
				return d.length >= 4 ? d.slice(-4) : d.padStart(4, '0');
			}
		};

		['click', 'touchstart', 'keydown'].forEach(evt => {
			document.body.addEventListener(evt, UI.initAudio, { once: true, passive: true });
		});

		let idleTimer = null;

					$('#screensaver').classList.add('active');
				}, 60000);
			}
		};

		['touchstart', 'mousemove', 'keydown', 'click'].forEach(evt => {
			document.body.addEventListener(evt, resetIdle, { passive: true });
		});

		setInterval(() => {
			const now = new Date();
			const hh = String(now.getHours()).padStart(2, '0');
			const mm = String(now.getMinutes()).padStart(2, '0');
			const month = now.getMonth() + 1;
			const date = now.getDate();
			const dow = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];

			const elTime = $('#ssTime');
			const elDate = $('#ssDate');
			if (elTime) elTime.textContent = hh + ':' + mm;
			if (elDate) elDate.textContent = month + '월 ' + date + '일 ' + dow + '요일';

			document.body.classList.remove('dark-mode');

			if (now.getHours() === 4 && now.getMinutes() === 0 && now.getSeconds() < 6) {
				location.reload();
			}
		}, 1000);

		if (navigator.getBattery) {
			navigator.getBattery().then(battery => {

					if (logoClicks >= 5) {
						logoClicks = 0;

							document.documentElement.requestFullscreen().catch(() => {});

							document.exitFullscreen().catch(() => {});

					}
				});

		const Kiosk = {

      _staffLongPressTimer: null,

      resetPendingMark() {

        Kiosk.pendingKioskAction = '';

      },

			init() {

          clearTimeout(Kiosk._idleClearTimer);

      document.addEventListener('keydown', e => {
        const offlineLock = $('#offlineLock');

        if ((offlineLock && offlineLock.classList.contains('show')) || Kiosk.isSubmitting) {
          return;
        }

        if (['F5', 'F12'].includes(e.key) || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
          e.preventDefault();
        }

        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'q') {
          location.reload();
        }

        if (App.currentView !== 'kiosk') return;

        if (e.getModifierState && e.getModifierState('CapsLock')) {
          UI.toast(false, '⚠️ Caps Lock을 꺼주세요.');
        }

        const modeMap = {
          'F1': 'CHECK_IN',
          '1': 'CHECK_IN',
          'F2': 'CHECK_OUT',
          '2': 'CHECK_OUT',
          'F3': 'MOVE',
          '3': 'MOVE',
          'F4': 'OUTING',
          '4': 'OUTING'
        };

        if (
          ['F1', 'F2', 'F3', 'F4'].includes(e.key) ||
          (e.altKey && ['1', '2', '3', '4'].includes(e.key))
        ) {
          e.preventDefault();
          Kiosk.setAction(modeMap[e.key]);
          return;
        }

        const input = $('#kInput');
        const phoneMid = $('#kPhoneMid');
        const phoneLast = $('#kPhoneLast');
        if (!input) return;

        const isPhoneSegmentActive = document.activeElement === phoneMid || document.activeElement === phoneLast;
        const isPlainChar =
          e.key.length === 1 &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey;

        if (isPlainChar) {
          const modal = $('#fullModal');
          if (modal) modal.classList.remove('show');
        }

        if (isPhoneSegmentActive) {
          if (e.key === 'Enter') {
            e.preventDefault();
            Kiosk.submitPhoneSegmentsOnEnter();
          }
          return;
        }

        if (isPlainChar) {
          e.preventDefault();

          if (/^[0-9]$/.test(e.key) && !/^(?:QR|Q3|STAFFQR)/i.test(String(input.value || ''))) {
            Kiosk.routePhysicalKeyToPhoneSegments(e.key);
            return;
          }

          safeFocus(input);
          Kiosk.routePhysicalKeyToRawScanner(e.key);
          return;
        }

        if (e.key === 'Enter') {
          e.preventDefault();

          const v = Kiosk.normalizeScanText(input.value);
          input.value = v;

          const shouldSubmit =
            Kiosk.isCompleteStudentQr(v) ||
            Kiosk.isCompleteStaffQr(v) ||
            Kiosk.shouldSubmitPhoneTail8(v);

          if (shouldSubmit) {
            Kiosk.queueSubmit(40);
          } else {
            Kiosk.submitPhoneSegmentsOnEnter();
          }
        }
      });

const StaffUI = {
			me: null,
			studentSearchTimer: null,
			studentSearchSeq: 0,
			studentOptionMap: new Map(),

			absenceRosterItems: [],

			ymdToDateInput(yyyymmdd) {
				const raw = String(yyyymmdd || '').replace(/[^0-9]/g, '');
				return /^\d{8}$/.test(raw)
					? raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6, 8)
					: '';
			},

			dateInputToYmd(value, fallbackToday) {
				const raw = String(value || '').trim().replace(/[^0-9]/g, '');
				if (/^\d{8}$/.test(raw)) return raw;
				return fallbackToday ? UI.ymd() : '';
			},

			yyyymmToMonthInput(yyyymm) {
				const raw = String(yyyymm || '').replace(/[^0-9]/g, '');
				return /^\d{6}$/.test(raw)
					? raw.slice(0, 4) + '-' + raw.slice(4, 6)
					: '';
			},

			monthInputToYyyymm(value, fallbackCurrent) {
				const raw = String(value || '').trim().replace(/[^0-9]/g, '');
				if (/^\d{6}$/.test(raw)) return raw;
				return fallbackCurrent ? UI.ymd().slice(0, 6) : '';
			},

			readYmdInput(id, fallbackToday) {
				const el = document.getElementById(id);
				return StaffUI.dateInputToYmd(el ? el.value : '', fallbackToday);
			},

			readYyyymmInput(id, fallbackCurrent) {
				const el = document.getElementById(id);
				return StaffUI.monthInputToYyyymm(el ? el.value : '', fallbackCurrent);
			},

			studentDisplay(studentId, studentName) {
				const sid = UI.padSid(studentId || '');
				const name = String(studentName || '').trim();
				if (name && sid) return name + ' (' + sid + ')';
				if (name) return name;
				return sid || '-';
			},

			formatAbsenceUntil(raw, yyyymmdd) {
				const value = String(raw || '').trim();
				if (!value) return '-';

				let ms = NaN;
				if (/^\d{10,13}$/.test(value)) {
					ms = value.length === 10 ? Number(value) * 1000 : Number(value);
				} else {
					ms = Date.parse(value);
				}

				if (!Number.isFinite(ms)) return value;

				const parts = new Intl.DateTimeFormat('ko-KR', {
					timeZone: 'Asia/Seoul',
					year: 'numeric',
					month: '2-digit',
					day: '2-digit',
					hour: '2-digit',
					minute: '2-digit',
					hour12: false
				}).formatToParts(new Date(ms));

				const map = {};
				parts.forEach(part => {
					if (part.type !== 'literal') map[part.type] = part.value;
				});

				const ymd = String(map.year || '') + String(map.month || '') + String(map.day || '');
				const hhmm = String(map.hour || '00') + ':' + String(map.minute || '00');

				if (String(yyyymmdd || '').trim() === ymd && hhmm === '23:59') {
					return '당일 끝까지';
				}

				return [
					map.year || '',
					map.month || '',
					map.day || ''
				].filter(Boolean).join('-') + ' ' + hhmm + '까지';
			},

			showReplicaPatchResult(r, successMessage, contextLabel) {
				const data = (r && r.data) ? r.data : {};
				const patched = data.replicaPatched;
				const patchError = String(data.replicaPatchError || '').trim();
				const box = $('#diagBox');

				if (r && r.ok && patched === false) {
					const headline = String(contextLabel || '실시간 replica 반영') + ' 경고';
					const warning =
						successMessage +
						' / 중앙DB 저장은 완료됐지만 실시간 replica 반영은 지연될 수 있습니다.' +
						(patchError ? ' (' + patchError + ')' : '');

					UI.toast(false, warning);

					if (box) {
						box.textContent =
							headline + '\n\n' +
							'central_db_bridge: OK\n' +
							'replica_patch: FAILED\n' +
							'error: ' + (patchError || '-') + '\n\n' +
							'필요 시 관리자 도구의 [중앙DB 최신화 반영]을 실행하세요.';
					}

					return false;
				}

				UI.toast(!!(r && r.ok), r && r.ok
					? successMessage
					: ((r && r.error && r.error.message) ? r.error.message : '실패'));

				return !!(r && r.ok);
			},

			renderStudentOptions(items) {
				const list = $('#staffStudentOptions');
				if (!list) return;

				const rows = Array.isArray(items) ? items : [];
				StaffUI.studentOptionMap = new Map();

				list.innerHTML = rows.map(item => {
					const sid = UI.padSid(item.student_id || '');
					const name = String(item.student_name || '').trim() || '이름 없음';
					const schoolGrade = [
						String(item.school || '').trim(),
						String(item.grade || '').trim()
					].filter(Boolean).join(' ');
					const label = schoolGrade
						? name + ' (' + sid + ') · ' + schoolGrade
						: name + ' (' + sid + ')';

					StaffUI.studentOptionMap.set(label, {
						student_id: sid,
						student_name: name,
						label
					});

					return '<option value="' + escapeHtml(label) + '"></option>';
				}).join('');
			},

			async searchStudentOptions(q, seq, extraArgs) {
				const r = await App.rpc('assistant.searchStudents', {
					q: String(q || '').trim(),
					limit: 20,
					...(extraArgs || {})
				});

				if (seq !== StaffUI.studentSearchSeq) return;
				if (!r.ok) {
					StaffUI.renderStudentOptions([]);
					return;
				}

				const items = Array.isArray(r.data && r.data.items) ? r.data.items : [];
				StaffUI.renderStudentOptions(items);
			},

			bindStudentLookup(id, opt) {
				const el = document.getElementById(id);
				if (!el) return;

				const options = opt || {};

				const run = () => {
					const q = String(el.value || '').trim();
					clearTimeout(StaffUI.studentSearchTimer);

					if (!q) {
						StaffUI.renderStudentOptions([]);
						return;
					}

					const extraArgs = {};
					if (options.classIdInputId) {
						const classEl = document.getElementById(options.classIdInputId);
						const classId = String(classEl && classEl.value ? classEl.value : '').trim();

						if (!classId) {
							StaffUI.renderStudentOptions([]);
							return;
						}

						extraArgs.class_id = classId;
					}

					const seq = ++StaffUI.studentSearchSeq;
					StaffUI.studentSearchTimer = setTimeout(() => {
						StaffUI.searchStudentOptions(q, seq, extraArgs);
					}, 180);
				};

				el.addEventListener('input', run);
				el.addEventListener('focus', () => {
					if (String(el.value || '').trim()) run();
				});

			readStudentSelection(id) {
				const el = document.getElementById(id);
				const raw = String(el && el.value ? el.value : '').trim();
				if (!raw) {
					return { student_id: '', student_name: '', label: '' };
				}

				const mapped = StaffUI.studentOptionMap.get(raw);
				if (mapped && mapped.student_id) {
					return mapped;
				}

				const match = raw.match(/\((\d{4})\)/);
				if (match && match[1]) {
					return {
						student_id: UI.padSid(match[1]),
						student_name: raw.split('(')[0].trim(),
						label: raw
					};
				}

				const digitsOnly = raw.replace(/[^0-9]/g, '');
				if (/^\d{1,4}$/.test(digitsOnly)) {
					return {
						student_id: UI.padSid(digitsOnly),

						label: UI.padSid(digitsOnly)

			async loadClassOptions() {

				});

					select.innerHTML = '<option value="">반 목록 조회 실패</option>';

					StaffUI.renderAbsenceClassSummary();

				StaffUI.classOptionMap = new Map(
					items.map(item => [String(item.class_id || '').trim(), item])
				);

				select.innerHTML =
					(items.length
						? '<option value="">해당 날짜 수업 반 선택</option>'
						: '<option value="">해당 날짜에 등록 가능한 수업 반이 없습니다</option>') +

							String(item.end || '').trim()
						].filter(Boolean).join('~');

							time,
							teacherName ? '담당 ' + teacherName : ''

			async abBulkUpsert() {
				const yyyymmdd = StaffUI.readYmdInput('abDate', false);
				const class_id = String(($('#abClassId') && $('#abClassId').value) || '').trim();
				const student_ids = StaffUI.selectedAbsenceRosterIds();
				const reason = ($('#abReason').value || '').trim();
				const untilMin = parseInt(($('#abUntilMin').value || '').trim(), 10);

				if (!yyyymmdd || !class_id) {
					UI.toast(false, '날짜와 반을 먼저 선택하세요.');
					return;
				}

				if (!student_ids.length) {
					UI.toast(false, '일괄 등록할 학생을 체크하세요.');
					return;
				}

				if (!confirm('선택한 ' + student_ids.length + '명에게 당일 미등원 알림 제외를 일괄 등록합니다. 계속할까요?')) {
					return;
				}

				await UI.withBtnBusy('#btnAbBulkUpsert', '일괄 등록 중...', async () => {
					const r = await App.rpc('assistant.bulkAddAbsenceExcuses', {
						yyyymmdd,
						class_id,
						student_ids,
						reason,
						until_min: untilMin || 0
					});

					if (!r.ok) {
						UI.toast(false, (r.error && r.error.message) ? r.error.message : '결석예외 일괄 등록 실패');
						return;
					}

					const d = r.data || {};
					const msg = '일괄 등록 완료: 성공 ' + (d.succeeded || 0) + '명 / 실패 ' + (d.failed || 0) + '명';

					UI.toast(
						(d.failed || 0) === 0 && (d.replica_warn || 0) === 0,
						msg + ((d.replica_warn || 0) ? ' / 실시간 replica 경고 ' + d.replica_warn + '건' : '')
					);

					const box = $('#abBox');
					if (box) {
						box.textContent =
							msg +
							((d.replica_warn || 0)
								? '\n실시간 replica 경고: ' + d.replica_warn + '건'
								: '');
					}

					await StaffUI.abList();
				});
			},

			async loadOpsOverview() {
				const box = $('#opsOverviewBox');
				if (box) box.textContent = '운영 상태를 불러오는 중...';

				const r = await App.rpc('admin.getOpsOverview');
				if (!r.ok) {
					if (box) {
						box.textContent = (r.error && r.error.message)
							? r.error.message
							: '운영 상태 조회 실패';
					}
					return;
				}

				const d = r.data || {};
				const replica = d.central_replica || {};
				const queue = d.queue || {};
				const absence = d.latest_absence_run || {};
				const worker = d.latest_notify_worker_run || {};
				const errors = d.errors || {};
				const cron = d.cron_health || {};

				const fmtCount = item => {
					if (!item) return '조회 실패';
					if (item.ok === false) {
						return '조회 실패: ' + (item.error || '-');
					}
					return String(item.count == null ? '-' : item.count) + '건';
				};

				const absenceLine = errors.latest_absence_run
					? '최근 미등원 감지: 조회 실패 - ' + errors.latest_absence_run
					: '최근 미등원 감지: ' +
						(absence.created_at || '-') +
						' / ' +
						(absence.status || '-') +
						' / queued ' +
						(absence.queued_count || 0) +
						' / failed ' +
						(absence.failed_count || 0);

				const workerLine = errors.latest_notify_worker_run
					? '최근 알림 worker: 조회 실패 - ' + errors.latest_notify_worker_run
					: '최근 알림 worker: ' +
						(worker.created_at || '-') +
						' / ' +
						(worker.status || '-') +
						' / done ' +
						(worker.done || 0) +
						' / failed ' +
						(worker.failed || 0);

				const absenceCronLine = errors.latest_absence_cron_run
					? '미등원 cron 상태: 조회 실패 - ' + errors.latest_absence_cron_run
					: '미등원 cron 상태: ' +
						(cron.absence_stale ? '⚠️ 지연/중단 의심' : '정상') +
						' / 최근 ' +
						(cron.absence_age_min == null ? '-' : cron.absence_age_min + '분 전') +
						' / 허용 ' +
						(cron.absence_max_stale_min == null ? '-' : cron.absence_max_stale_min + '분');

				const notifyWorkerCronLine = errors.latest_notify_worker_cron_run
					? '알림 worker cron 상태: 조회 실패 - ' + errors.latest_notify_worker_cron_run
					: '알림 worker cron 상태: ' +
						(cron.notify_worker_stale ? '⚠️ 지연/중단 의심' : '정상') +
						' / 최근 ' +
						(cron.notify_worker_age_min == null ? '-' : cron.notify_worker_age_min + '분 전') +
						' / 허용 ' +
						(cron.notify_worker_max_stale_min == null ? '-' : cron.notify_worker_max_stale_min + '분');

				if (box) {
					box.textContent =
						'운영 상태 요약\n\n' +
						'SAFE MODE: ' +
						((d.safe && String(d.safe.mode || '').toUpperCase() === 'Y') ? 'ON' : 'OFF') +
						'\n' +
						'KIOSK FLOOR: ' + (d.kiosk_floor || '-') + '\n' +
						'중앙DB sync: ' + (replica.status || '-') + ' / ' + (replica.syncedAt || '-') + '\n' +
						'중앙DB sync 경과: ' + (replica.ageMin == null ? '-' : replica.ageMin + '분') + '\n' +
						'실패 queue - 미등원: ' + fmtCount(queue.failed_absent) +
						' / 등하원: ' + fmtCount(queue.failed_attendance) + '\n' +
						'대기 queue 전체: ' + fmtCount(queue.pending_all) + '\n\n' +
						absenceCronLine + '\n' +
						notifyWorkerCronLine + '\n\n' +
						absenceLine + '\n' +
						workerLine + '\n' +
						'checked_at: ' + (d.checked_at || '-');
				}
			},

			async loadLogs() {
				const yyyymmdd = StaffUI.readYmdInput('logDate', true);
				const student = StaffUI.readStudentSelection('logSid');
				const rawStudentQuery = String(($('#logSid') && $('#logSid').value) || '').trim();

			formatWorkMonth(yyyymm) {
				const raw = String(yyyymm || '').trim();
				if (/^\d{6}$/.test(raw)) {
					return raw.slice(0, 4) + '년 ' + Number(raw.slice(4, 6)) + '월';
				}
				return raw || '-';
				},

				formatWorkYmd(yyyymmdd) {
				const raw = String(yyyymmdd || '').trim();
				if (/^\d{8}$/.test(raw)) {
					return raw.slice(0, 4) + '.' + raw.slice(4, 6) + '.' + raw.slice(6, 8);
				}
				return raw || '-';
				},

				formatWorkKstHm(raw) {
				const s = String(raw || '').trim();
				if (!s) return '-';

				const d = new Date(s);
				if (Number.isNaN(d.getTime())) return escapeHtml(s);

				try {
					return new Intl.DateTimeFormat('ko-KR', {
					timeZone: 'Asia/Seoul',
					hour: '2-digit',
					minute: '2-digit',
					hour12: false
					}).format(d);
				} catch (_) {
					return escapeHtml(s);
				}
				},

				formatWorkHours(raw) {
				const n = Number(raw || 0);
				if (!Number.isFinite(n)) return '-';
				return n.toFixed(2) + '시간';
				},

				formatWorkedLabel(row) {
				const minutes = Number(row && row.worked_minutes);
				const hours = Number(row && row.worked_hours);

				if (Number.isFinite(minutes)) {
					const h = Number.isFinite(hours) ? hours.toFixed(2) : (minutes / 60).toFixed(2);
					return minutes + '분 (' + h + '시간)';
				}

				if (Number.isFinite(hours)) {
					return hours.toFixed(2) + '시간';
				}

				return '-';
				},

				workStatusChip(status) {
				const raw = String(status || '').trim().toUpperCase();

				if (raw === 'OK') {
					return '<span class="workChip ok">정상</span>';
				}

				if (raw === 'MISSING_OUT') {
					return '<span class="workChip bad">퇴근 누락</span>';
				}

				if (raw === 'MISSING_IN') {
					return '<span class="workChip bad">출근 누락</span>';
				}

				if (raw === 'NO_PAIR') {
					return '<span class="workChip warn">확인 필요</span>';
				}

				return '<span class="workChip warn">' + escapeHtml(raw || '-') + '</span>';
				},

					box.textContent = '최근 미등원 실행 이력이 없습니다.';
					UI.toast(true, '이력 없음');
					return;
				}

				box.innerHTML = `
					<div style="font-weight:900; margin-bottom:10px;">최근 미등원 실행 이력: ${items.length}건</div>
					<div class="logScroll" style="max-height:280px;">
						<table class="logTable">
							<thead>
								<tr>
									<th>created_at</th>
									<th>source</th>
									<th>status</th>
									<th>ymd</th>
									<th>candidate</th>
									<th>queued</th>
									<th>sent</th>
									<th>failed</th>
									<th>error</th>
								</tr>
							</thead>
							<tbody>
								${items.map(x => `
									<tr>
										<td>${escapeHtml(x.created_at || '')}</td>
										<td>${escapeHtml(x.source || '')}</td>
										<td>${escapeHtml(x.status || '')}</td>
										<td>${escapeHtml(x.yyyymmdd || '')}</td>
										<td>${escapeHtml(x.candidate_count || 0)}</td>
										<td>${escapeHtml(x.queued_count || 0)}</td>
										<td>${escapeHtml(x.sent_count || x.worker_done || 0)}</td>
										<td>${escapeHtml(x.failed_count || x.worker_failed || 0)}</td>
										<td class="wrap">${escapeHtml(x.error || '')}</td>
									</tr>
								`).join('')}
							</tbody>
						</table>
					</div>
				`;

				UI.toast(true, '미등원 이력 조회 완료');
			},

			async notifyWorkerRuns() {
				const box = $('#diagBox');
				if (!box) return;

				box.textContent = '최근 알림 worker 실행 이력 조회 중...';

				const r = await App.rpc('admin.listNotifyWorkerRuns', {
					limit: 30
				});

				if (!r.ok) {
					box.textContent = (r.error && r.error.message) ? r.error.message : '알림 worker 이력 조회 실패';
					UI.toast(false, 'worker 이력 조회 실패');
					return;
				}

				const items = Array.isArray(r.data && r.data.items) ? r.data.items : [];

				if (!items.length) {
					box.textContent = '최근 알림 worker 실행 이력이 없습니다.';
					UI.toast(true, 'worker 이력 없음');
					return;
				}

				box.innerHTML = `
					<div style="font-weight:900; margin-bottom:10px;">최근 알림 worker 실행 이력: ${items.length}건</div>
					<div class="logScroll" style="max-height:280px;">
						<table class="logTable">
							<thead>
								<tr>
									<th>created_at</th>
									<th>source</th>
									<th>status</th>
									<th>scanned</th>
									<th>claimed</th>
									<th>done</th>
									<th>failed</th>
									<th>requeued</th>
									<th>error</th>
								</tr>
							</thead>
							<tbody>
								${items.map(x => `
									<tr>
										<td>${escapeHtml(x.created_at || '')}</td>
										<td>${escapeHtml(x.source || '')}</td>
										<td>${escapeHtml(x.status || '')}</td>
										<td>${escapeHtml(x.scanned || 0)}</td>
										<td>${escapeHtml(x.claimed || 0)}</td>
										<td>${escapeHtml(x.done || 0)}</td>
										<td>${escapeHtml(x.failed || 0)}</td>
										<td>${escapeHtml(x.requeued || 0)}</td>
										<td class="wrap">${escapeHtml(x.error || '')}</td>
									</tr>
								`).join('')}
							</tbody>
						</table>
					</div>
				`;

				UI.toast(true, '알림 worker 이력 조회 완료');
			},

			async previewNotifyPayload() {
				const pin = prompt('[보안 확인] 알림톡 payload를 미리보려면 관리자 PIN을 입력하세요.');
				if (!pin) return;

				const student = StaffUI.readStudentSelection('payloadStudent');
				const studentId = student.student_id;

				if (!studentId) {
					UI.toast(false, 'payload를 확인할 학생을 이름 검색 후 목록에서 선택하세요.');
					return;
				}

				const box = $('#diagBox');
				if (box) box.textContent = '알림톡 payload 생성 중...';

				const r = await App.rpc('admin.previewNotifyPayload', {
					pin,
					student_id: studentId
				});

				if (!r.ok) {
					const msg = (r.error && r.error.message) ? r.error.message : '알림톡 payload 미리보기 실패';
					if (box) box.textContent = msg;
					UI.toast(false, msg);
					return;
				}

				if (box) {
					box.textContent = JSON.stringify(r.data || {}, null, 2);
				}

				UI.toast(true, '알림톡 payload 생성 완료');
			},

			async cleanupQrExpiredDry() {
				const pin = prompt('[보안 확인] 운영 만료 모의 정리를 실행하려면 관리자 PIN을 입력하세요.\n실제 삭제는 수행하지 않습니다.');
				if (!pin) return;

				const box = $('#diagBox');
				if (box) box.textContent = '운영 만료 데이터 모의 정리 중...';

				const r = await App.rpc('admin.cleanupQrExpired', {
					pin,
					dry_run: 'Y'
				});

				if (!r.ok) {
					const msg = (r.error && r.error.message) ? r.error.message : '운영 만료 모의 정리 실패';
					if (box) box.textContent = msg;
					UI.toast(false, msg);
					return;
				}

				const d = r.data || {};

				if (box) {
					box.textContent =
						'운영 만료 모의 정리 완료\n\n' +
						'실제 삭제: 없음\n' +
						'audit_keep_days: ' + (d.audit_keep_days || '') + '\n' +
						'pin_attempt_keep_days: ' + (d.pin_attempt_keep_days || '') + '\n' +
						'total_would_delete: ' + (d.total_would_delete || 0) + '\n\n' +
						'failed_count: ' + (d.failed_count || 0) + '\n\n' +
						(Array.isArray(d.items) ? d.items.map(x => {
						return x.table + ': ' + (x.count || 0) + '개 삭제 예정' + (x.error ? ' / ' + x.error : '');
						}).join('\n') : '') + '\n\n' +
						'message: ' + (d.message || '');
				}

				UI.toast((d.failed_count || 0) > 0 ? false : true, (d.failed_count || 0) > 0 ? '모의 정리 일부 실패' : '운영 만료 모의 정리 완료');
			},

			async cleanupQrExpired() {
				const pin = prompt('[보안 확인] 만료된 QR/세션/오래된 audit 데이터를 정리하려면 관리자 PIN을 입력하세요.');
				if (!pin) return;
				if (!confirm('실제 운영 데이터를 삭제합니다.\n만료 QR, 만료 세션, 오래된 audit 일부가 삭제됩니다.\n먼저 모의 정리를 실행한 뒤 진행하는 것을 권장합니다.\n계속할까요?')) {
					return;
				}

				const box = $('#diagBox');
				if (box) box.textContent = '운영 만료 데이터 정리 중...';

				const r = await App.rpc('admin.cleanupQrExpired', {
					pin
				});

				if (!r.ok) {
					const msg = (r.error && r.error.message) ? r.error.message : '운영 만료 정리 실패';
					if (box) box.textContent = msg;
					UI.toast(false, msg);
					return;
				}

				const d = r.data || {};
				const items = Array.isArray(d.items) ? d.items : [];

				if (box) {
					box.textContent =
						'운영 만료 데이터 정리 완료\n\n' +
						'total_deleted: ' + (d.total_deleted || 0) + '\n\n' +
						items.map(x => {
							return x.table + ': ' + (x.deleted || 0) + '개 삭제';
						}).join('\n');
				}

				UI.toast(true, '운영 만료 정리 완료');
			},
			
			async flushCache() {
				const pin = prompt('[보안 확인] 캐시를 비우시려면 관리자 PIN을 입력하세요.');
				if (!pin) return;
				const r = await App.rpc('admin.flushCache', { pin });
				UI.toast(!!r.ok, r.ok ? '캐시를 비웠습니다.' : ((r.error && r.error.message) ? r.error.message : '실패'));
			},

			async manualAttendance() {
				const student = StaffUI.readStudentSelection('manSid');
				const student_id = student.student_id;
				const action_type = ($('#manAction').value || '').trim();
				const reason = ($('#manReason').value || '').trim();
				const source_trace_id = ($('#manSourceTrace').value || '').trim();

				if (!student_id) {
					UI.toast(false, '학생 이름을 검색한 뒤 목록에서 선택하세요.');
					return;
				}

				if (!action_type || !reason || !source_trace_id) {
					UI.toast(false, '정정 액션, 정정 사유, 오류 원본 trace_id 입력이 모두 필수입니다.');
					return;
				}

				const studentLabel = student.label || StaffUI.studentDisplay(student_id, student.student_name);
				const pin = prompt(`[${studentLabel}] 학생의 출결을 [${action_type}]으로 강제 정정합니다.\n진행하시려면 본인(직원)의 PIN 번호를 입력하세요.`);
				if (pin == null) {
					UI.toast(false, '수동 정정이 취소되었습니다.');
					return;
				}

				const btn = $('#btnManualAttendance');
				if (!btn || btn.disabled) return;

				const oldText = btn.textContent;
				btn.disabled = true;
				btn.textContent = '처리 중...';

				try {
					const r = await App.rpc('assistant.manualAttendance', {
						pin,
						student_id,
						action_type,
						reason,
						source_trace_id
					});

					if (r.ok) {
						const state = (r.data && r.data.state) ? r.data.state : {};
						if (state.write_ok === false) {
							UI.toast(false, '수동 정정은 저장됐지만 현재 상태 갱신은 실패했습니다.');
							const diagBox = $('#diagBox');
							if (diagBox) {
								diagBox.textContent =
									'수동 정정 상태 갱신 경고\n\n' +
									'attendance_logs 저장: OK\n' +
									'today_student_state 갱신: FAILED\n' +
									'source: ' + (state.source || '') + '\n' +
									'error: ' + (state.error || '');
							}
						} else {
							UI.toast(true, '수동 정정 저장 완료');
						}

						$('#manSid').value = '';
						$('#manAction').value = '';
						$('#manReason').value = '';
						$('#manSourceTrace').value = '';
					} else {
						UI.toast(false, (r.error && r.error.message) ? r.error.message : '실패');
					}
				} finally {
					btn.disabled = false;
					btn.textContent = oldText;
				}
			}
		};

		window.addEventListener('online', async () => {
      $('#offlineLock').classList.remove('show');

      await App.refreshMeta();

      if (App.currentView === 'staff') {
        Router.goStaff();
      } else {
        Router.goKiosk();
      }
    });

		window.onload = () => {
			if (!navigator.onLine) {
				$('#offlineLock').classList.add('show');
				UI.setMeta({ safe: { mode: 'Y', message: '오프라인' } });
			}
			App.init().catch(err => {
				renderFatalBootError('앱 시작 실패', (err && err.message) || err || '알 수 없는 오류');
			});
		};
	</script>
</body>
</html>
