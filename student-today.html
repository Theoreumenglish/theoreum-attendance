<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>더오름영어 오늘 할 일</title>
  <style>
    :root{
      --bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--pri:#2563eb;--pri2:#1e40af;
      --line:#dde3ef;--soft:#eef4ff;--good:#157347;--warn:#b45309;--bad:#b42318;--shadow:0 14px 34px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .wrap{max-width:820px;margin:0 auto;padding:22px 16px 48px}
    .hero{border-radius:26px;padding:24px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;box-shadow:0 18px 42px rgba(37,99,235,.22)}
    .heroTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    h1{font-size:25px;margin:0 0 8px;letter-spacing:-.02em}.hero p{margin:0;color:#dbeafe;line-height:1.55}
    .refreshBtn{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:900;white-space:nowrap;cursor:pointer}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    .summaryBox{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);border-radius:16px;padding:12px}
    .summaryNum{font-size:22px;font-weight:950}.summaryLabel{font-size:12px;color:#dbeafe;margin-top:2px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:16px;padding:18px;box-shadow:var(--shadow)}
    .cardHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
    .label{font-size:14px;color:#27364f;font-weight:950}.sub{font-size:12px;color:var(--muted);font-weight:800}
    .value{font-size:28px;font-weight:950;margin-top:4px;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:#eef2ff;color:#1e40af;font-size:12px;font-weight:900}
    .pill.good{background:#ecfdf3;color:var(--good)}.pill.warn{background:#fff7ed;color:var(--warn)}.pill.bad{background:#fef3f2;color:var(--bad)}
    .item{padding:13px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.title{font-weight:950;letter-spacing:-.01em}
    .desc{margin-top:5px;color:var(--muted);font-size:14px;line-height:1.48}.empty{color:var(--muted);line-height:1.55}.badText{color:var(--bad)}.warnText{color:var(--warn)}.goodText{color:var(--good)}
    .cta{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:11px 14px;background:var(--pri);color:#fff!important;font-weight:950;text-decoration:none;margin-top:10px}
    .mutedBox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:14px;color:var(--muted);line-height:1.5}
    .loadingBar{height:10px;border-radius:999px;background:linear-gradient(90deg,#e2e8f0,#bfdbfe,#e2e8f0);background-size:180% 100%;animation:pulse 1.2s infinite}
    @keyframes pulse{0%{background-position:0% 0}100%{background-position:180% 0}}
    a{color:var(--pri)}
    @media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.value{font-size:24px}.wrap{padding:14px 12px 36px}.hero{border-radius:20px}.heroTop{display:block}.refreshBtn{margin-top:12px;width:100%}}
  </style>
</head>
<body data-qa-state="boot">
  <main class="wrap" id="studentTodayRoot" data-qa-state="boot">
    <section class="hero">
      <div class="heroTop">
        <div>
          <h1>더오름영어 오늘 할 일</h1>
          <p id="heroText">링크 정보를 불러오는 중입니다.</p>
        </div>
        <button class="refreshBtn" id="refreshBtn" type="button">새로고침</button>
      </div>
      <div class="summary" id="taskSummary" aria-live="polite">
        <div class="summaryBox"><div class="summaryNum">-</div><div class="summaryLabel">출결</div></div>
        <div class="summaryBox"><div class="summaryNum">-</div><div class="summaryLabel">클리닉</div></div>
        <div class="summaryBox"><div class="summaryNum">-</div><div class="summaryLabel">단어</div></div>
        <div class="summaryBox"><div class="summaryNum">-</div><div class="summaryLabel">강의</div></div>
      </div>
    </section>

    <section class="card" id="statusCard"><div class="loadingBar" aria-label="loading"></div><div class="empty" style="margin-top:12px;">잠시만 기다려 주세요.</div></section>

    <section class="card">
      <div class="cardHead"><div class="label">클리닉 / 보완</div><div class="sub" id="clinicCount">-</div></div>
      <div id="clinicBox" class="empty" style="margin-top:10px;">불러오는 중입니다.</div>
    </section>

    <section class="card">
      <div class="cardHead"><div class="label">최근 단어 기록</div><div class="sub" id="wordCount">-</div></div>
      <div id="wordBox" class="empty" style="margin-top:10px;">불러오는 중입니다.</div>
    </section>

    <section class="card">
      <div class="cardHead"><div class="label">온라인강의</div><div class="sub" id="lectureCount">-</div></div>
      <div id="lectureBox" class="empty" style="margin-top:10px;">불러오는 중입니다.</div>
    </section>

    <section class="card" id="warningCard" style="display:none;">
      <div class="label warnText">확인 안내</div>
      <div id="warningBox" class="desc"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setQaState(state){document.body.dataset.qaState=state; $('studentTodayRoot').dataset.qaState=state;}
    function ymdText(v){const s=String(v||'');return s.length===8?`${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`:s||'-'}
    function dueText(v){const s=String(v||'');return s.length===8?`기한 ${ymdText(s)}`:'기한 없음'}
    function badge(text, cls=''){return `<span class="pill ${cls}">${esc(text)}</span>`}
    async function rpc(op,args){
      const res=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,args})});
      const json=await res.json().catch(()=>({ok:false,error:{message:'응답 해석 실패'}}));
      if(!res.ok&&!json.error) json.error={message:`HTTP ${res.status}`};
      return json;
    }
    function renderItems(id,items,empty,fn){
      $(id).innerHTML=items&&items.length?items.map(fn).join(''):`<div class="mutedBox">${esc(empty)}</div>`;
    }
    function renderSummary(d){
      const clinics=(d.clinics||[]).length;
      const words=(d.words||[]).filter(x=>x.needs_retest||x.needs_clinic||String(x.result_status||'').includes('FAIL')).length;
      const lectures=(d.lectures||[]).filter(x=>String(x.status||'ACTIVE')!=='COMPLETED').length;
      const today=d.today||{};
      $('taskSummary').innerHTML=`
        <div class="summaryBox"><div class="summaryNum">${esc(today.label||'-')}</div><div class="summaryLabel">오늘 출결</div></div>
        <div class="summaryBox"><div class="summaryNum">${clinics}</div><div class="summaryLabel">클리닉/보완</div></div>
        <div class="summaryBox"><div class="summaryNum">${words}</div><div class="summaryLabel">단어 확인</div></div>
        <div class="summaryBox"><div class="summaryNum">${lectures}</div><div class="summaryLabel">온라인강의</div></div>`;
      $('clinicCount').textContent=clinics?`${clinics}건`:'없음';
      $('wordCount').textContent=(d.words||[]).length?`${(d.words||[]).length}건`:'없음';
      $('lectureCount').textContent=(d.lectures||[]).length?`${(d.lectures||[]).length}건`:'없음';
    }
    function renderWarnings(warnings){
      const list=Array.isArray(warnings)?warnings:[];
      if(!list.length){$('warningCard').style.display='none';return;}
      $('warningCard').style.display='';
      $('warningBox').innerHTML=list.map(x=>`<div class="item"><b>${esc(x.area||'system')}</b><div>${esc(x.message||'일부 정보를 불러오지 못했습니다.')}</div></div>`).join('');
    }
    async function load(){
      setQaState('loading');
      const token=new URLSearchParams(location.search).get('t')||'';
      if(!token){
        $('heroText').textContent='링크 토큰이 없습니다.';
        $('statusCard').innerHTML='<div class="mutedBox badText">잘못된 링크입니다. 학원에서 받은 최신 링크로 다시 접속해 주세요.</div>';
        $('clinicBox').innerHTML='<div class="mutedBox">표시할 항목이 없습니다.</div>';
        $('wordBox').innerHTML='<div class="mutedBox">표시할 항목이 없습니다.</div>';
        $('lectureBox').innerHTML='<div class="mutedBox">표시할 항목이 없습니다.</div>';
        setQaState('error');
        return;
      }
      try{
        const r=await rpc('studentToday.publicGet',{token});
        if(!r.ok){
          const msg=r.error?.message||'링크를 불러오지 못했습니다.';
          $('heroText').textContent=msg;
          $('statusCard').innerHTML=`<div class="mutedBox badText">${esc(msg)}</div>`;
          setQaState('error');
          return;
        }
        const d=r.data||{}; const st=d.student||{}; const today=d.today||{};
        $('heroText').textContent=`${st.student_name||'학생'} · ${[st.school,st.grade].filter(Boolean).join(' ')} · ${ymdText(d.yyyymmdd)}`;
        renderSummary(d);
        $('statusCard').innerHTML=`<div class="grid">
          <div><div class="label">오늘 출결</div><div class="value">${esc(today.label||'-')}</div><div class="desc">마지막 동작: ${esc(today.last_action||'-')} · ${esc(today.source||'')}</div></div>
          <div><div class="label">링크 만료</div><div class="value" style="font-size:18px">${esc((d.link&&d.link.expires_at)||'-')}</div><div class="desc">링크가 열리지 않거나 정보가 다르면 학원으로 연락해 주세요.</div></div>
        </div>`;
        renderItems('clinicBox',d.clinics||[],'오늘 표시할 클리닉/보완 항목이 없습니다.',x=>`<div class="item"><div class="title">${esc(x.title||'클리닉')}</div><div class="desc">${badge(x.status||'확인 필요')} ${esc(x.clinic_mode||'')} · 기한: ${esc(x.due_date||'-')} ${esc(x.due_time||'')}</div>${x.note?`<div class="desc">${esc(x.note)}</div>`:''}</div>`);
        renderItems('wordBox',d.words||[],'최근 단어 기록이 없습니다.',x=>`<div class="item"><div class="title">${esc(ymdText(x.yyyymmdd))} · ${esc(x.title||'단어')}</div><div class="desc">${esc(x.range_label||'')} · ${x.correct==null?'-':esc(x.correct)}/${esc(x.total||0)} · 상태: ${esc(x.result_status||'-')}${x.needs_retest?' · 재시험 필요':''}${x.needs_clinic?' · 클리닉 후보':''}</div></div>`);
        renderItems('lectureBox',d.lectures||[],'현재 학생에게 표시되는 온라인강의가 없습니다.',x=>`<div class="item"><div class="title">${esc(x.title||'강의')}</div><div class="desc">${badge(x.status==='COMPLETED'?'완료':'수강 필요',x.status==='COMPLETED'?'good':'warn')} · ${esc(dueText(x.due_date))}</div>${x.note?`<div class="desc">${esc(x.note)}</div>`:''}<a class="cta" href="${esc(x.url||'#')}" target="_blank" rel="noreferrer">강의 열기</a></div>`);
        renderWarnings(d.warnings||[]);
        setQaState('loaded');
      }catch(e){
        const msg=e?.message||String(e);
        $('heroText').textContent='정보를 불러오는 중 오류가 발생했습니다.';
        $('statusCard').innerHTML=`<div class="mutedBox badText">${esc(msg)}</div>`;
        setQaState('error');
      }
    }
    $('refreshBtn').addEventListener('click',load);
    load();
  </script>
</body>
</html>
